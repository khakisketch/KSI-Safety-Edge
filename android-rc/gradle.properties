org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
# All SDK components the build needs are installed explicitly (setup in
# docs); never let AGP invoke its SDK auto-installer (sdkmanager) at build
# time — on the qemu x86_64 container path that JVM is unreliable, and a
# real missing component should fail with AGP's own message instead.
android.builder.sdkDownload=false
