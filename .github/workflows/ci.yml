# KSI Safety Edge — CI (C65)
#
# Every push to main runs the same verification the workstreams use locally:
#   python   — contracts + core + harness pytest suites
#   edge     — host C++ build + ctest (includes the MOP cross-language fixtures)
#   android  — rc-ports/rc-core/rc-msdk/rc-app unit tests on x86_64, where the
#              six WorkManager/Robolectric tests that SKIP on the aarch64 host
#              actually RUN, plus the bench APK and a device-flavor compile.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (contracts, core, harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable)
        run: pip install -e libs/ksi_contracts -e core -e harness pytest pyyaml httpx
      - name: Test
        run: python -m pytest libs/ksi_contracts/tests core/tests harness/tests -q

  edge:
    name: Edge C++ (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S edge -B edge/build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build edge/build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir edge/build --output-on-failure

  android:
    name: Android (unit tests incl. WorkManager on x86_64 + bench APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK components (preinstalled SDK)
        # ubuntu-latest ships the Android SDK at $ANDROID_HOME with
        # cmdline-tools; accept the remaining licenses and install exactly the
        # components the build requires. The build sets
        # android.builder.sdkDownload=false, so a missing component must fail
        # with AGP's own message instead of being auto-fetched mid-build.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (rc-ports, rc-core, rc-msdk, rc-app bench)
        # On x86_64 the six WorkManager/Robolectric tests that SKIP on the
        # aarch64 dev host run here for real.
        run: ./gradlew :rc-ports:test :rc-core:test :rc-msdk:testDebugUnitTest :rc-app:testBenchDebugUnitTest
      - name: Bench APK + device flavor compile
        run: ./gradlew :rc-app:assembleBenchDebug :rc-app:compileDeviceDebugKotlin
