<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf5"/><stop offset="1" stop-color="#f4f7f9"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5a8a" stop-opacity="0.28"/><stop offset="1" stop-color="#0e5a8a" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="450" rx="12" fill="url(#sky)"/>
  <!-- sun / cloud -->
  <circle cx="700" cy="60" r="26" fill="#f5c542" opacity="0.85"/>
  <ellipse cx="180" cy="60" rx="46" ry="16" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="220" cy="52" rx="34" ry="13" fill="#ffffff" opacity="0.9"/>
  <!-- ground -->
  <rect x="0" y="330" width="800" height="120" fill="#e3d9c2"/>
  <rect x="0" y="330" width="800" height="6" fill="#c9bfa4"/>
  <!-- site fence -->
  <g stroke="#8a94a0" stroke-width="3">
    <line x1="40" y1="300" x2="40" y2="332"/><line x1="120" y1="300" x2="120" y2="332"/>
    <line x1="200" y1="300" x2="200" y2="332"/><line x1="280" y1="300" x2="280" y2="332"/>
    <line x1="360" y1="300" x2="360" y2="332"/><line x1="440" y1="300" x2="440" y2="332"/>
    <line x1="520" y1="300" x2="520" y2="332"/><line x1="600" y1="300" x2="600" y2="332"/>
    <line x1="680" y1="300" x2="680" y2="332"/><line x1="760" y1="300" x2="760" y2="332"/>
    <line x1="30" y1="308" x2="770" y2="308"/>
  </g>
  <!-- buildings -->
  <rect x="90" y="200" width="90" height="104" fill="#b9c4cf"/>
  <rect x="105" y="216" width="20" height="16" fill="#eef3f7"/><rect x="133" y="216" width="20" height="16" fill="#eef3f7"/>
  <rect x="105" y="242" width="20" height="16" fill="#eef3f7"/><rect x="133" y="242" width="20" height="16" fill="#eef3f7"/>
  <rect x="620" y="230" width="70" height="74" fill="#c3ccd5"/>
  <rect x="632" y="244" width="16" height="14" fill="#eef3f7"/><rect x="654" y="244" width="16" height="14" fill="#eef3f7"/>
  <!-- crane -->
  <g stroke="#e08a2e" stroke-width="5" stroke-linecap="round">
    <line x1="420" y1="180" x2="420" y2="332"/><line x1="420" y1="180" x2="560" y2="180"/>
    <line x1="520" y1="180" x2="520" y2="230"/>
  </g>
  <rect x="508" y="230" width="24" height="18" fill="#e08a2e"/>
  <!-- excavator (simple) -->
  <g>
    <rect x="300" y="292" width="70" height="26" rx="5" fill="#e8a13a"/>
    <rect x="310" y="272" width="30" height="24" rx="3" fill="#f2b95c"/>
    <rect x="306" y="318" width="58" height="10" rx="5" fill="#5b6b7c"/>
    <line x1="366" y1="296" x2="410" y2="320" stroke="#e8a13a" stroke-width="7" stroke-linecap="round"/>
    <rect x="404" y="316" width="16" height="14" fill="#8a94a0"/>
  </g>
  <!-- workers -->
  <g fill="#0e5a8a">
    <circle cx="250" cy="300" r="7"/><rect x="244" y="306" width="12" height="20" rx="4"/>
    <circle cx="480" cy="306" r="7"/><rect x="474" y="312" width="12" height="18" rx="4"/>
  </g>
  <!-- danger zone -->
  <polygon points="230,336 430,336 470,420 190,420" fill="#d64545" opacity="0.10"/>
  <polygon points="230,336 430,336 470,420 190,420" fill="none" stroke="#d64545" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="300" y="352" width="100" height="26" rx="13" fill="#d64545"/>
  <text x="350" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">위험구역 (예시)</text>
  <!-- observation cone from drone -->
  <polygon points="400,120 210,336 470,336" fill="url(#cone)"/>
  <!-- drone -->
  <g>
    <line x1="350" y1="108" x2="450" y2="108" stroke="#1a2b3c" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="348" cy="104" rx="22" ry="5" fill="#1a2b3c" opacity="0.55"/>
    <ellipse cx="452" cy="104" rx="22" ry="5" fill="#1a2b3c" opacity="0.55"/>
    <rect x="382" y="100" width="36" height="20" rx="6" fill="#1a2b3c"/>
    <circle cx="400" cy="122" r="6" fill="#0e5a8a"/>
    <line x1="400" y1="128" x2="400" y2="140" stroke="#0e5a8a" stroke-width="3"/>
  </g>
  <rect x="330" y="66" width="140" height="26" rx="13" fill="#1a2b3c"/>
  <text x="400" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">관측 드론 (예시)</text>
  <!-- offline badge -->
  <rect x="560" y="96" width="190" height="60" rx="10" fill="#ffffff" stroke="#dfe7ee" stroke-width="2"/>
  <text x="655" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b3c">인터넷 없음 → 로컬 기록</text>
  <text x="655" y="140" text-anchor="middle" font-size="12" fill="#5b6b7c">복구 후 RC가 Core에 업로드</text>
  <!-- operator -->
  <g>
    <circle cx="90" cy="368" r="9" fill="#1a2b3c"/><rect x="81" y="377" width="18" height="28" rx="5" fill="#1a2b3c"/>
    <rect x="104" y="384" width="26" height="18" rx="3" fill="#5b6b7c"/>
  </g>
  <text x="103" y="424" text-anchor="middle" font-size="12" fill="#1a2b3c">조종자 + RC (예시)</text>
  <text x="400" y="442" text-anchor="middle" font-size="12" fill="#5b6b7c">개념도 — 실제 현장 사진이 아니며 특정 현장을 지칭하지 않습니다</text>
</svg>
